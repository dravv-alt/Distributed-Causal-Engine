receivers:
  otlp:
    protocols:
      http:
        endpoint: 127.0.0.1:4318
exporters:
  otlphttp/dce:
    endpoint: http://127.0.0.1:9000
    tls:
      insecure: true
    sending_queue:
      enabled: false
    retry_on_failure:
      enabled: true
      initial_interval: 100ms
      max_interval: 200ms
      max_elapsed_time: 2s
  debug:
    verbosity: basic
service:
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 127.0.0.1
                port: 9101
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [otlphttp/dce, debug]
    metrics:
      receivers: [otlp]
      exporters: [otlphttp/dce, debug]
    logs:
      receivers: [otlp]
      exporters: [otlphttp/dce, debug]
