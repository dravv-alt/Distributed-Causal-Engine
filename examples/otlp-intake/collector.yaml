receivers:
  otlp:
    protocols:
      http:
        endpoint: 127.0.0.1:4317

exporters:
  otlphttp/dce:
    endpoint: http://127.0.0.1:4318
    tls:
      insecure: true

service:
  pipelines:
    metrics:
      receivers: [otlp]
      exporters: [otlphttp/dce]
    traces:
      receivers: [otlp]
      exporters: [otlphttp/dce]
