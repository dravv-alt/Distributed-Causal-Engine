[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dce-foundation"
version = "0.1.0"
description = "DCE representation and replay foundation, separate from delivered R0"
requires-python = ">=3.11"
dependencies = ["networkx>=3.4,<4"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
dce-openrca = "dce_foundation.replay.openrca:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["dce_foundation*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
