[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dce"
version = "0.1.0"
description = "Distributed Causal Engine: neuro-symbolic incident intelligence (R0 foundation)"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "networkx>=3.0"]

[project.optional-dependencies]
train = ["scikit-learn>=1.4"]
dev = ["pytest>=8", "scikit-learn>=1.4"]

[project.scripts]
dce = "dce.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
